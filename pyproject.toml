[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tplegal-demand-generator"
version = "0.4.0"
description = "Demand letter generator & compensation calculator"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "holidays",
    "zeep",
]

[project.optional-dependencies]
# Deklaracja istniejącej zależności testowej dla CI — nie nowa dep runtime.
test = [
    "pytest>=7",
]

[project.scripts]
generate-demand = "demand_generator.generator:main"
calc-rekompensa = "demand_generator.calc_cli:main"
check-rates = "demand_generator.check_rates:main"

[tool.setuptools.packages.find]
include = ["demand_generator*"]

[tool.setuptools.package-data]
demand_generator = ["templates/*.docx"]
