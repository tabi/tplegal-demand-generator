name: tests

# Ten pakiet jest instalowany bezpośrednio z main (pip install git+...@main)
# przy każdej sesji generowania wezwań, więc main JEST produkcją.
# Dlatego testy odpalają się na push do main, nie tylko na pull requestach.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalacja pakietu wraz z zależnościami testowymi
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Testy — cały katalog tests/, bez dostępu do sieci
        # tests/conftest.py blokuje realne gniazda: każde niezamockowane
        # wywołanie NBP/GUS pada z NetworkAccessInTestError.
        run: python -m pytest tests/ -v
